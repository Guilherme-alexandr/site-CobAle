<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pesquisa - CobAle</title>
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap');

        * {
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: #f6f8fc;
            color: #1e3a5f;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        header {
            background: linear-gradient(135deg, #1e3a5f, #274b8a);
            color: white;
            text-align: center;
            padding: 1.8rem 1rem;
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.1);
            position: relative; /* Importante para o alinhamento dos botões absolutos */
        }

        header h1 {
            margin: 0;
            font-size: 1.8rem;
        }

        header p {
            margin: 0.3rem 0 0;
            font-size: 1rem;
            opacity: 0.9;
        }

        .container {
            flex: 1;
            width: 100%;
            max-width: 1200px;
            margin: 2rem auto;
            padding: 0 1rem;
        }

        .filtros {
            background-color: #ffffff;
            padding: 1.5rem;
            border-radius: 12px;
            box-shadow: 0 3px 8px rgba(0, 0, 0, 0.08);
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 1rem;
            margin-bottom: 2rem;
            align-items: end;
        }

        .campo {
            display: flex;
            flex-direction: column;
        }

        .campo label {
            font-weight: 600;
            color: #2c3e50;
            margin-bottom: 0.3rem;
        }

        .campo input {
            padding: 0.6rem 0.8rem;
            border: 1px solid #d0d7de;
            border-radius: 6px;
            font-size: 0.95rem;
            transition: border-color 0.3s;
        }

        .campo input:focus {
            border-color: #1dd1a1;
            outline: none;
        }

        .filtros button {
            padding: 0.8rem 1.2rem;
            background-color: #1dd1a1;
            color: white;
            font-weight: 600;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .filtros button:hover {
            background-color: #10ac84;
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.2);
        }

        .tabela-container {
            background: white;
            border-radius: 12px;
            box-shadow: 0 3px 8px rgba(0, 0, 0, 0.06);
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            min-width: 600px;
        }

        th,
        td {
            text-align: left;
            padding: 1rem;
            border-bottom: 1px solid #e0e0e0;
        }

        th {
            background-color: #1e3a5f;
            color: white;
            font-weight: 600;
            text-transform: uppercase;
            font-size: 0.9rem;
        }

        tr:hover {
            background-color: #f8f9fb;
        }

        td:last-child {
            text-align: center;
        }

        .negociar-link {
            color: #1e90ff;
            font-weight: 500;
            cursor: pointer;
            text-decoration: underline;
            transition: color 0.2s ease;
        }

        .negociar-link:hover {
            color: #0c6ecf;
        }

        footer {
            background-color: #f0f2f5;
            text-align: center;
            padding: 1rem;
            font-size: 0.9rem;
            color: #555;
            margin-top: auto;
        }

        #theme-toggle {
            position: absolute;
            top: 1rem;
            right: 1rem;
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(4px);
            border: 1px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            color: white;
            font-size: 1.3rem;
            width: 2.2rem;
            height: 2.2rem;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        #theme-toggle:hover {
            transform: scale(1.15);
            background: rgba(255, 255, 255, 0.25);
        }

        /* Botões de ação no header */
        .header-btn {
            position: absolute;
            top: 1rem;
            padding: 0.4rem 0.8rem;
            font-weight: 600;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.3s ease;
            color: white;
        }

        #sair-btn {
            right: 5rem;
            background-color: #e74c3c;
        }

        #controle-btn {
            right: 9rem;
            background-color: #3498db;
        }

        .header-btn:hover {
            transform: scale(1.05);
            opacity: 0.85;
        }

        /* Tema escuro */
        body.dark-mode {
            background-color: #121212;
            color: #e0e0e0;
        }

        body.dark-mode header {
            background: linear-gradient(135deg, #0d1b2a, #1b263b);
            color: #f1f1f1;
            box-shadow: 0 2px 6px rgba(255, 255, 255, 0.05);
        }

        body.dark-mode .filtros {
            background-color: #1c1c1c;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.5);
        }

        body.dark-mode .campo label {
            color: #ddd;
        }

        body.dark-mode .campo input {
            background-color: #2a2a2a;
            border: 1px solid #444;
            color: #f1f1f1;
        }

        body.dark-mode .campo input::placeholder {
            color: #888;
        }

        body.dark-mode .filtros button {
            background-color: #10ac84;
            box-shadow: none;
        }

        body.dark-mode .filtros button:hover {
            background-color: #0b8b6a;
        }

        body.dark-mode .tabela-container {
            background-color: #1c1c1c;
            box-shadow: 0 3px 8px rgba(0, 0, 0, 0.5);
        }

        body.dark-mode table {
            color: #ddd;
        }

        body.dark-mode th {
            background-color: #0d1b2a;
            color: #f1f1f1;
        }

        body.dark-mode tr:hover {
            background-color: #222;
        }

        body.dark-mode td {
            border-bottom: 1px solid #333;
        }

        body.dark-mode .negociar-link {
            color: #4db8ff;
        }

        body.dark-mode .negociar-link:hover {
            color: #81d4fa;
        }

        body.dark-mode footer {
            background-color: #0d1b2a;
            color: #aaa;
        }

        body.dark-mode #sair-btn {
            background-color: #c0392b;
        }

        body.dark-mode #controle-btn {
            background-color: #2980b9;
        }

        /* Responsividade (Mobile) */
        @media (max-width: 768px) {
            .container {
                margin: 1rem auto;
                padding: 0 0.8rem;
            }

            header h1 {
                font-size: 1.5rem;
            }

            .filtros {
                grid-template-columns: 1fr;
                gap: 0.8rem;
            }

            #controle-btn, #sair-btn, #theme-toggle {
                position: static;
                display: block;
                width: 100%;
                margin: 0.5rem 0;
            }

            header {
                display: flex;
                flex-direction: column;
                align-items: center;
                gap: 0.5rem;
                padding-bottom: 1rem;
            }

            table, thead, tbody, th, td, tr {
                display: block;
            }

            thead tr {
                display: none;
            }

            tbody tr {
                background: #fff;
                border-radius: 10px;
                margin-bottom: 1rem;
                box-shadow: 0 2px 6px rgba(0, 0, 0, 0.05);
                padding: 0.5rem;
            }

            tbody td {
                display: flex;
                justify-content: space-between;
                padding: 0.6rem;
                border: none;
                border-bottom: 1px solid #f0f0f0;
            }

            tbody td::before {
                content: attr(data-label);
                font-weight: 600;
                color: #555;
            }
            
            body.dark-mode tbody tr {
                background: #1c1c1c;
            }
            
            body.dark-mode tbody td {
                border-bottom: 1px solid #333;
            }
            
            body.dark-mode tbody td::before {
                color: #aaa;
            }
        }
    </style>
</head>

<body>

    <header>
        <h1>CobAle</h1>
        <p>Consulta de Contratos</p>
        <button id="controle-btn" class="header-btn" style="display: none;">Controle</button>
        <button id="sair-btn" class="header-btn">Sair</button>
        <button id="theme-toggle" aria-label="Alternar tema">🌙</button>
    </header>

    <main class="container">
        <section class="filtros">
            <div class="campo">
                <label for="nome">Nome</label>
                <input type="text" id="nome" placeholder="Ex: João Silva" />
            </div>

            <div class="campo">
                <label for="cpf">CPF</label>
                <input type="text" id="cpf" placeholder="Ex: 12345678901" />
            </div>

            <div class="campo">
                <label for="numeroContrato">Nº Contrato</label>
                <input type="text" id="numeroContrato" placeholder="Ex: 123456" />
            </div>

            <button onclick="buscar()">Buscar</button>
        </section>

        <section class="tabela-container">
            <table id="resultado">
                <thead>
                    <tr>
                        <th>Nome</th>
                        <th>CPF</th>
                        <th>Nº Contrato</th>
                        <th>Valor Total</th>
                        <th>Acordo</th>
                        <th>Ações</th>
                    </tr>
                </thead>
                <tbody></tbody>
            </table>
        </section>
    </main>

    <footer>
        <p>© 2025 CobAle — Sistema de Gestão de Contratos</p>
    </footer>

    <script>
        const API_BASE = "https://cob-ale.onrender.com/";
        //const API_BASE = "http://127.0.0.1:5000/";

        // ===== Função de busca =====
        async function buscar() {
            const cpf = document.getElementById('cpf').value.trim();
            const nome = document.getElementById('nome').value.trim();
            const numeroContrato = document.getElementById('numeroContrato').value.trim();

            if (!cpf && !nome && !numeroContrato) {
                alert("Por favor, preencha pelo menos um campo de busca.");
                return;
            }

            try {
                let clientes = [];

                // Buscar por CPF parcial
                if (cpf) {
                    const resp = await fetch(`${API_BASE}clientes/buscar_por_cpf/${cpf}`);
                    if (resp.ok) {
                        const dados = await resp.json();
                        clientes = Array.isArray(dados) ? dados : [dados];
                    }
                }

                // Buscar por número de contrato
                if (numeroContrato) {
                    const respContrato = await fetch(`${API_BASE}contratos/${numeroContrato}`);
                    if (respContrato.ok) {
                        const contrato = await respContrato.json();
                        const respCliente = await fetch(`${API_BASE}clientes/${contrato.cliente_id}`);
                        if (respCliente.ok) {
                            const cliente = await respCliente.json();
                            if (!clientes.some(c => c.id === cliente.id)) {
                                clientes.push(cliente);
                            }
                        }
                    }
                }

                // Buscar por nome parcial
                if (nome) {
                    const respNome = await fetch(`${API_BASE}clientes/buscar_por_nome/${nome}`);
                    if (respNome.ok) {
                        let clientesPorNome = await respNome.json();

                        if (!Array.isArray(clientesPorNome)) {
                            clientesPorNome = clientesPorNome ? [clientesPorNome] : [];
                        }

                        for (const cliente of clientesPorNome) {
                            if (!clientes.some(c => c.id === cliente.id)) {
                                clientes.push(cliente);
                            }
                        }
                    }
                }

                if (!clientes.length) {
                    alert("Nenhum resultado encontrado.");
                    return;
                }

                const tbody = document.querySelector('#resultado tbody');
                tbody.innerHTML = '';

                for (const cliente of clientes) {
                    const respContratos = await fetch(`${API_BASE}contratos/buscar_por_cliente/${cliente.id}`);
                    if (!respContratos.ok) continue;

                    const contratos = await respContratos.json();

                    for (const contrato of contratos) {
                        let statusAcordo = "Sem acordo";
                        try {
                            const respAcordo = await fetch(`${API_BASE}acordos/buscar_por_contrato/${contrato.numero_contrato}`);
                            if (respAcordo.ok) {
                                const acordo = await respAcordo.json();
                                if (acordo && acordo.status) {
                                    statusAcordo = acordo.status;
                                } else {
                                    statusAcordo = "Possui acordo";
                                }
                            }
                        } catch (e) {
                            console.warn("Erro ao verificar acordo:", e);
                        }

                        const linha = document.createElement('tr');
                        // Adicionados atributos data-label para manter o CSS mobile funcional de forma dinâmica
                        linha.innerHTML = `
                            <td data-label="Nome">${cliente.nome}</td>
                            <td data-label="CPF">${cliente.cpf}</td>
                            <td data-label="Nº Contrato">${contrato.numero_contrato}</td>
                            <td data-label="Valor Total">R$ ${Number(contrato.valor_total).toFixed(2).replace('.', ',')}</td>
                            <td data-label="Acordo">${statusAcordo}</td>
                            <td data-label="Ações">
                                <a href="../view/negociacao.html?cpf=${cliente.cpf}&contrato=${contrato.numero_contrato}" class="negociar-link">
                                    Negociar
                                </a>
                            </td>
                        `;
                        tbody.appendChild(linha);
                    }
                }

            } catch (erro) {
                console.error("Erro ao buscar:", erro);
                alert("Erro ao buscar os dados. Verifique o console.");
            }
        }

        // ===== Controle de Inicialização (Tema e Autenticação) =====
        document.addEventListener("DOMContentLoaded", () => {
            // ===== Tema escuro/claro =====
            const toggleBtn = document.getElementById('theme-toggle');
            const currentTheme = localStorage.getItem('theme');

            if (currentTheme === 'dark') {
                document.body.classList.add('dark-mode');
                toggleBtn.textContent = '☀️';
            } else if (currentTheme === 'light') {
                document.body.classList.remove('dark-mode');
                toggleBtn.textContent = '🌙';
            } else if (window.matchMedia('(prefers-color-scheme: dark)').matches) {
                document.body.classList.add('dark-mode');
                toggleBtn.textContent = '☀️';
            }

            toggleBtn.addEventListener('click', () => {
                document.body.classList.toggle('dark-mode');
                const isDark = document.body.classList.contains('dark-mode');
                toggleBtn.textContent = isDark ? '☀️' : '🌙';
                localStorage.setItem('theme', isDark ? 'dark' : 'light');
            });

            // ===== Validação de Usuário, Botões Sair e Controle =====
            const sairBtn = document.getElementById('sair-btn');
            const controleBtn = document.getElementById('controle-btn');

            const usuario = JSON.parse(localStorage.getItem('usuario'));
            if (!usuario) {
                window.location.href = "login.html";
                return;
            }

            // Mostrar botão Controle apenas para gerente ou supervisor
            if (usuario.cargo === 'gerente' || usuario.cargo === 'supervisor') {
                controleBtn.style.display = 'inline-block';
            }

            sairBtn.addEventListener('click', () => {
                localStorage.clear();
                window.location.href = "login.html";
            });

            controleBtn.addEventListener('click', () => {
                window.location.href = "controle_usuario.html";
            });
        });
    </script>
</body>

</html>
