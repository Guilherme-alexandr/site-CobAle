<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Controle de Contratos - CobAle</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="/css/controle_contratos.css">
</head>

<body>
    <!-- ===== HEADER ===== -->
    <header>
        <div class="header-content">
            <div class="logo-section">
                <h1><i class="fas fa-file-contract"></i> Controle de Contratos</h1>
            </div>
            <div class="header-actions">
                <button class="header-btn criar" id="criarClienteBtn" title="Criar novo cliente"><i class="fas fa-user-plus"></i> Cliente</button>
                <button class="header-btn criar" id="criarContratoBtn" title="Criar novo contrato"><i class="fas fa-plus"></i> Contrato</button>
                <button class="header-btn criar" id="importarBtn" title="Importar arquivos"><i class="fas fa-upload"></i> Importar</button>
                <button class="header-btn voltar" onclick="window.location.href='pesquisa.html'" title="Voltar à pesquisa"><i class="fas fa-arrow-left"></i> Voltar</button>
            </div>
            <button id="theme-toggle" aria-label="Alternar tema" title="Alternar para modo escuro"><i class="fas fa-moon"></i></button>
        </div>
    </header>

    <!-- ===== MAIN CONTENT ===== -->
    <main class="container">
        <section class="tabela-container">
            <table>
                <thead>
                    <tr>
                        <th><i class="fas fa-user"></i> Cliente</th>
                        <th><i class="fas fa-id-card"></i> CPF</th>
                        <th><i class="fas fa-phone"></i> Telefone</th>
                        <th><i class="fas fa-envelope"></i> Email</th>
                        <th><i class="fas fa-file-signature"></i> Contrato</th>
                        <th><i class="fas fa-dollar-sign"></i> Valor</th>
                        <th><i class="fas fa-building"></i> Filial</th>
                        <th><i class="fas fa-calendar-alt"></i> Vencimento</th>
                    </tr>
                </thead>
                <tbody id="tabela-body">
                    <!-- Dados inseridos dinamicamente -->
                </tbody>
            </table>
        </section>
    </main>

    <!-- ===== FOOTER ===== -->
    <footer>
        <p><i class="fas fa-copyright"></i> 2025 CobAle — Sistema de Cobrança e Acordos</p>
    </footer>

    <!-- ===== POPUP - NOVO CLIENTE ===== -->
    <div class="popup hidden" id="popupCliente">
        <div class="popup-content">
            <button class="fechar-popup" onclick="fecharPopup('popupCliente')" title="Fechar popup">&times;</button>
            <h2><i class="fas fa-user-plus"></i> Novo Cliente</h2>
            <form id="form-criar-cliente" aria-labelledby="popupCliente">
                <label for="nome"><i class="fas fa-user"></i> Nome:</label>
                <input type="text" id="nome" name="nome" required>

                <label for="cpf"><i class="fas fa-id-card"></i> CPF:</label>
                <input type="text" id="cpf" name="cpf" maxlength="11" required>

                <label for="telefone"><i class="fas fa-phone"></i> Telefone:</label>
                <input type="text" id="telefone" name="telefone">

                <label for="email"><i class="fas fa-envelope"></i> Email:</label>
                <input type="email" id="email" name="email">

                <h3><i class="fas fa-map-marker-alt"></i> Endereço</h3>
                <input type="text" id="rua" name="rua" placeholder="Rua">
                <input type="text" id="numero" name="numero" placeholder="Número">
                <input type="text" id="cidade" name="cidade" placeholder="Cidade">
                <input type="text" id="estado" name="estado" placeholder="UF" maxlength="2" pattern="[A-Za-z]{2}">
                <input type="text" id="cep" name="cep" placeholder="CEP">

                <div class="popup-actions">
                    <button type="submit" class="salvar" title="Salvar cliente"><i class="fas fa-save"></i> Salvar</button>
                    <button type="button" class="cancelar" onclick="fecharPopup('popupCliente')" title="Cancelar criação"><i class="fas fa-times"></i> Cancelar</button>
                </div>
            </form>
        </div>
    </div>

    <!-- ===== POPUP - NOVO CONTRATO ===== -->
    <div class="popup hidden" id="popupContrato">
        <div class="popup-content">
            <button class="fechar-popup" onclick="fecharPopup('popupContrato')" title="Fechar popup">&times;</button>
            <h2><i class="fas fa-file-signature"></i> Novo Contrato</h2>
            <form id="form-criar-contrato" aria-labelledby="popupContrato">
                <label for="cpf_cliente"><i class="fas fa-id-card"></i> CPF do Cliente:</label>
                <input type="text" id="cpf_cliente" name="cpf_cliente" required>

                <label for="valor_total"><i class="fas fa-dollar-sign"></i> Valor Total:</label>
                <input type="number" id="valor_total" name="valor_total" step="0.01" required>

                <label for="filial"><i class="fas fa-building"></i> Filial:</label>
                <input type="text" id="filial" name="filial" required>

                <label for="vencimento"><i class="fas fa-calendar-alt"></i> Data de Vencimento:</label>
                <input type="date" id="vencimento" name="vencimento" required>

                <div class="popup-actions">
                    <button type="submit" class="salvar" title="Salvar contrato"><i class="fas fa-save"></i> Salvar</button>
                    <button type="button" class="cancelar" onclick="fecharPopup('popupContrato')" title="Cancelar criação"><i class="fas fa-times"></i> Cancelar</button>
                </div>
            </form>
        </div>
    </div>

    <!-- ===== POPUP - IMPORTAR ARQUIVOS ===== -->
    <div class="popup hidden" id="popupImportar">
        <div class="popup-content">
            <button class="fechar-popup" onclick="fecharPopup('popupImportar')" title="Fechar popup">&times;</button>
            <h2><i class="fas fa-upload"></i> Importar Arquivos</h2>
            <form id="form-importar" aria-labelledby="popupImportar">
                <label for="tipo_importacao"><i class="fas fa-list"></i> Tipo de Importação:</label>
                <select id="tipo_importacao" name="tipo_importacao" required>
                    <option value="">Selecione</option>
                    <option value="clientes">Clientes</option>
                    <option value="contratos">Contratos</option>
                    <option value="tudo">Clientes + Contratos</option>
                </select>

                <div class="popup-actions">
                    <button type="submit" class="salvar" title="Importar arquivo"><i class="fas fa-upload"></i> Importar</button>
                    <button type="button" class="cancelar" onclick="fecharPopup('popupImportar')" title="Cancelar importação"><i class="fas fa-times"></i> Cancelar</button>
                </div>
            </form>
        </div>
    </div>

    <script src="/javascript/controle_contratos.js"></script>
</body>

</html>
