<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Controle de Usuários - CobAle</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap');

        body {
            font-family: 'Inter', sans-serif;
            background-color: #f6f8fc;
            margin: 0;
            color: #1e3a5f;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            transition: background-color 0.3s ease, color 0.3s ease;
        }

        main.container {
            flex: 1;
        }

        /* ===== HEADER ===== */
        header {
            background: linear-gradient(135deg, #1e3a5f, #274b8a);
            color: white;
            text-align: center;
            padding: 1.5rem;
            position: relative;
        }

        header h1 {
            margin: 0 0 0.3rem 0;
            font-size: 1.8rem;
        }

        header p {
            margin: 0;
            opacity: 0.9;
            font-size: 0.95rem;
        }

        .header-actions {
            position: absolute;
            right: 1.5rem;
            top: 1.5rem;
            display: flex;
            gap: 0.8rem;
        }

        .header-btn {
            border: none;
            border-radius: 6px;
            padding: 0.6rem 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            color: white;
        }

        .header-btn.voltar {
            background-color: #95a5a6;
        }

        .header-btn.criar {
            background-color: #1dd1a1;
        }

        .header-btn:hover {
            opacity: 0.85;
            transform: translateY(-1px);
        }

        /* ===== CONTEÚDO ===== */
        .container {
            width: 90%;
            max-width: 1000px;
            margin: 2rem auto;
        }

        /* ===== FILTROS ===== */
        .filtros-usuarios {
            background-color: #ffffff;
            padding: 1rem 1.5rem;
            border-radius: 12px;
            box-shadow: 0 3px 8px rgba(0, 0, 0, 0.08);
            display: flex;
            flex-wrap: wrap;
            gap: 1rem;
            align-items: flex-end;
            margin-bottom: 1.5rem;
        }

        .filtros-usuarios .campo {
            flex: 1;
            min-width: 220px;
            display: flex;
            flex-direction: column;
        }

        .filtros-usuarios label {
            font-weight: 600;
            margin-bottom: 0.4rem;
            color: #2c3e50;
            font-size: 0.9rem;
        }

        .filtros-usuarios input,
        .filtros-usuarios select {
            padding: 0.6rem 0.8rem;
            border: 1px solid #d0d7de;
            border-radius: 6px;
            font-size: 0.95rem;
            transition: border-color 0.3s, box-shadow 0.3s;
            background-color: #fff;
            color: #000;
        }

        .filtros-usuarios input:focus,
        .filtros-usuarios select:focus {
            border-color: #1dd1a1;
            outline: none;
            box-shadow: 0 0 0 3px rgba(29, 209, 161, 0.15);
        }

        .btn-filtro {
            padding: 0.65rem 1.2rem;
            background-color: #1e3a5f;
            color: white;
            border: none;
            border-radius: 6px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .btn-filtro:hover {
            background-color: #274b8a;
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.2);
        }

        /* ===== TABELA ===== */
        .tabela-container {
            background-color: white;
            border-radius: 10px;
            box-shadow: 0 3px 8px rgba(0, 0, 0, 0.1);
            overflow-x: auto; /* Garante que tabelas grandes não quebrem no mobile */
        }

        table {
            width: 100%;
            border-collapse: collapse;
            background-color: transparent;
        }

        th, td {
            padding: 1rem;
            border-bottom: 1px solid #ddd;
            text-align: left;
        }

        th {
            background-color: #1e3a5f;
            color: white;
            text-transform: uppercase;
            font-size: 0.85rem;
            letter-spacing: 0.5px;
        }

        td {
            color: #333;
            font-size: 0.95rem;
        }

        tr:hover {
            background-color: #f8fafc;
        }

        td button.editar {
            border: none;
            border-radius: 4px;
            padding: 0.4rem 0.8rem;
            cursor: pointer;
            color: white;
            font-weight: 600;
            background-color: #3498db;
            transition: background-color 0.2s;
        }

        td button.editar:hover {
            background-color: #2c82c9;
        }

        /* ===== POPUPS ===== */
        .popup {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.55);
            display: flex;
            align-items: center;
            justify-content: center;
            backdrop-filter: blur(4px);
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
            z-index: 1000;
        }

        .popup:not(.hidden) {
            opacity: 1;
            pointer-events: all;
        }

        .popup-content {
            position: relative;
            background: #ffffff;
            border-radius: 16px;
            padding: 2rem 2.2rem;
            width: 90%;
            max-width: 420px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.25);
            animation: popupFadeIn 0.3s ease;
            transform: scale(0.96);
            transition: transform 0.25s ease;
        }

        .popup:not(.hidden) .popup-content {
            transform: scale(1);
        }

        .popup-content h2 {
            text-align: center;
            font-weight: 700;
            color: #1e3a5f;
            font-size: 1.4rem;
            margin: 0 0 1.2rem 0;
        }

        .popup-content form {
            display: flex;
            flex-direction: column;
            gap: 0.6rem;
        }

        .popup-content label {
            font-weight: 600;
            color: #2c3e50;
            margin-top: 0.4rem;
            font-size: 0.9rem;
        }

        .popup-content input,
        .popup-content select {
            padding: 0.7rem 0.9rem;
            border-radius: 8px;
            border: 1px solid #cfd9e2;
            background-color: #f9fbfd;
            font-size: 1rem;
            transition: border-color 0.25s ease, box-shadow 0.25s ease;
            color: #000;
        }

        .popup-content input:focus,
        .popup-content select:focus {
            border-color: #1dd1a1;
            box-shadow: 0 0 0 3px rgba(29, 209, 161, 0.15);
            outline: none;
        }

        /* ===== BOTÕES DO POPUP ===== */
        .popup-actions {
            display: flex;
            justify-content: space-between;
            gap: 0.8rem;
            margin-top: 1.4rem;
        }

        .popup-actions button {
            flex: 1;
            border: none;
            border-radius: 8px;
            padding: 0.7rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.25s ease;
        }

        .salvar { background-color: #1dd1a1; color: #fff; }
        .salvar:hover { background-color: #17b890; }

        .excluir { background-color: #e74c3c; color: #fff; }
        .excluir:hover { background-color: #c0392b; }

        .cancelar { background-color: #95a5a6; color: #fff; }
        .cancelar:hover { background-color: #7f8c8d; }

        @keyframes popupFadeIn {
            from { opacity: 0; transform: translateY(-20px) scale(0.97); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }

        /* ===== BOTÃO DE TEMA ===== */
        #theme-toggle {
            position: absolute;
            top: 5rem;
            right: 1.5rem;
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(4px);
            border: 1px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            color: white;
            font-size: 1.2rem;
            width: 2.4rem;
            height: 2.4rem;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        #theme-toggle:hover {
            transform: scale(1.1);
            background: rgba(255, 255, 255, 0.25);
        }

        /* ===== FOOTER ===== */
        footer {
            background-color: #f0f2f5;
            text-align: center;
            padding: 1.2rem;
            font-size: 0.9rem;
            color: #555;
            margin-top: auto;
        }

        /* ===== TEMA ESCURO (DARK MODE) ===== */
        body.dark-mode {
            background-color: #121212;
            color: #e0e0e0;
        }

        body.dark-mode header {
            background: linear-gradient(135deg, #0d1b2a, #1b263b);
            color: #f1f1f1;
            box-shadow: 0 2px 6px rgba(255,255,255,0.05);
        }

        body.dark-mode .filtros-usuarios {
            background-color: #1c1c1c;
            box-shadow: 0 2px 8px rgba(0,0,0,0.5);
        }

        body.dark-mode .filtros-usuarios label {
            color: #ddd;
        }

        body.dark-mode .filtros-usuarios input,
        body.dark-mode .filtros-usuarios select {
            background-color: #2a2a2a;
            border: 1px solid #444;
            color: #f1f1f1;
        }

        body.dark-mode .filtros-usuarios input::placeholder {
            color: #888;
        }

        body.dark-mode .btn-filtro {
            background-color: #10ac84;
        }

        body.dark-mode .btn-filtro:hover {
            background-color: #0b8b6a;
        }

        body.dark-mode .tabela-container {
            background-color: #1c1c1c;
            box-shadow: 0 3px 8px rgba(0,0,0,0.5);
        }

        body.dark-mode table th {
            background-color: #0d1b2a;
            color: #f1f1f1;
        }

        body.dark-mode table td {
            color: #ddd;
            border-bottom: 1px solid #333;
        }

        body.dark-mode tr:hover {
            background-color: #252525;
        }

        body.dark-mode .popup-content {
            background-color: #1e1e1e;
            color: #eee;
            box-shadow: 0 6px 25px rgba(0,0,0,0.7);
        }

        body.dark-mode .popup-content h2 {
            color: #fff;
        }

        body.dark-mode .popup-content label {
            color: #ccc;
        }

        body.dark-mode .popup-content input,
        body.dark-mode .popup-content select {
            background-color: #2b2b2b;
            border: 1px solid #444;
            color: #fff;
        }

        body.dark-mode .popup-content input:focus,
        body.dark-mode .popup-content select:focus {
            border-color: #10ac84;
            box-shadow: 0 0 0 3px rgba(16, 172, 132, 0.2);
        }

        body.dark-mode footer {
            background-color: #0d1b2a;
            color: #aaa;
        }

        /* Classes auxiliares ocultas */
        .hidden {
            display: none !important;
        }

        /* Responsividade Básica do Header */
        @media (max-width: 680px) {
            header { padding-bottom: 5rem; }
            .header-actions { position: static; justify-content: center; margin-top: 1rem; }
            #theme-toggle { top: 1.5rem; right: 1rem; }
        }
    </style>
</head>

<body>
    <header>
        <h1>Controle de Usuários</h1>
        <p>Gerencie os usuários do sistema</p>

        <div class="header-actions">
            <button id="btnCriar" class="header-btn criar">+ Criar Usuário</button>
            <button id="btnVoltar" class="header-btn voltar">Voltar</button>
        </div>

        <button id="theme-toggle" aria-label="Alternar tema" title="Alternar tema (Claro/Escuro)">🌙</button>
    </header>

    <main class="container">

        <section class="filtros-usuarios">
            <div class="campo">
                <label for="pesquisaNome">Pesquisar por nome:</label>
                <input type="text" id="pesquisaNome" placeholder="Digite o nome do usuário..." />
            </div>

            <div class="campo">
                <label for="filtroCargo">Filtrar por cargo:</label>
                <select id="filtroCargo">
                    <option value="">Todos</option>
                    <option value="operador">Operador</option>
                    <option value="supervisor">Supervisor</option>
                    <option value="gerente">Gerente</option>
                </select>
            </div>

            <button id="btnLimparFiltros" class="btn-filtro">Limpar Filtros</button>
        </section>

        <section class="tabela-container">
            <table id="tabelaUsuarios">
                <thead>
                    <tr>
                        <th>Nome</th>
                        <th>Login</th>
                        <th>Senha</th>
                        <th>Cargo</th>
                        <th>Ações</th>
                    </tr>
                </thead>
                <tbody>
                    </tbody>
            </table>
        </section>
    </main>

    <div id="popupEdicao" class="popup hidden">
        <div class="popup-content">
            <h2>Editar Usuário</h2>
            <form id="formEdicao">
                <label for="editNome">Nome</label>
                <input type="text" id="editNome" required />

                <label for="editLogin">Login</label>
                <input type="text" id="editLogin" required />

                <label for="editSenha">Senha</label>
                <input type="password" id="editSenha" placeholder="Deixe em branco para não alterar" />

                <label for="editCargo">Cargo</label>
                <select id="editCargo" required>
                    <option value="operador">Operador</option>
                    <option value="supervisor">Supervisor</option>
                    <option value="gerente">Gerente</option>
                </select>

                <div class="popup-actions">
                    <button type="submit" class="salvar">Salvar</button>
                    <button type="button" id="btnExcluir" class="excluir">Excluir</button>
                    <button type="button" id="btnCancelar" class="cancelar">Cancelar</button>
                </div>
            </form>
        </div>
    </div>

    <div id="popupCriar" class="popup hidden">
        <div class="popup-content">
            <h2>Novo Usuário</h2>
            <form id="formCriar">
                <label for="novoNome">Nome</label>
                <input type="text" id="novoNome" required />

                <label for="novoLogin">Login</label>
                <input type="text" id="novoLogin" required />

                <label for="novaSenha">Senha</label>
                <input type="password" id="novaSenha" required />

                <label for="novoCargo">Cargo</label>
                <select id="novoCargo" required>
                    <option value="operador">Operador</option>
                    <option value="supervisor">Supervisor</option>
                    <option value="gerente">Gerente</option>
                </select>

                <div class="popup-actions">
                    <button type="submit" class="salvar">Criar</button>
                    <button type="button" id="btnCancelarCriar" class="cancelar">Cancelar</button>
                </div>
            </form>
        </div>
    </div>
    
    <footer>
        © 2026 CobAle — Painel Administrativo
    </footer>

    <script>
        const API_BASE = "https://cob-ale.onrender.com";
        //const API_BASE = "http://127.0.0.1:5000";

        const tabelaBody = document.querySelector("#tabelaUsuarios tbody");
        const popupEdicao = document.getElementById("popupEdicao");
        const popupCriar = document.getElementById("popupCriar");
        const pesquisaNome = document.getElementById("pesquisaNome");
        const filtroCargo = document.getElementById("filtroCargo");
        const btnLimparFiltros = document.getElementById("btnLimparFiltros");
        const themeToggle = document.getElementById("theme-toggle");

        // Aplica o tema imediatamente ao carregar para evitar flicker em branco
        if (localStorage.getItem("tema") === "dark") {
            document.body.classList.add("dark-mode");
            themeToggle.textContent = "☀️";
        }

        async function carregarUsuarios() {
            try {
                const resp = await fetch(`${API_BASE}/user/listar`);
                const usuarios = await resp.json();
                tabelaBody.innerHTML = "";

                usuarios.forEach(u => {
                    const tr = document.createElement("tr");
                    tr.innerHTML = `
                        <td>${u.nome}</td>
                        <td>${u.login}</td>
                        <td>${"*".repeat(6)}</td>
                        <td>${u.cargo}</td>
                        <td><button class="editar" onclick="abrirEdicao(${u.id}, '${u.nome}', '${u.login}', '${u.cargo}')">Editar</button></td>
                    `;
                    tabelaBody.appendChild(tr);
                });
            } catch (err) {
                console.error("Erro ao carregar usuários:", err);
            }
        }

        function aplicarFiltros() {
            const termo = pesquisaNome.value.toLowerCase();
            const cargoSelecionado = filtroCargo.value;
            const linhas = document.querySelectorAll("#tabelaUsuarios tbody tr");

            linhas.forEach(linha => {
                const nome = linha.children[0].textContent.toLowerCase();
                const cargo = linha.children[3].textContent.toLowerCase().trim();

                const correspondeNome = nome.includes(termo);
                const correspondeCargo = cargoSelecionado === "" || cargo === cargoSelecionado.toLowerCase();

                linha.style.display = (correspondeNome && correspondeCargo) ? "" : "none";
            });
        }

        pesquisaNome.addEventListener("input", aplicarFiltros);
        filtroCargo.addEventListener("change", aplicarFiltros);

        btnLimparFiltros.addEventListener("click", () => {
            pesquisaNome.value = "";
            filtroCargo.value = "";
            aplicarFiltros();
        });

        function abrirEdicao(id, nome, login, cargo) {
            popupEdicao.classList.remove("hidden");
            document.getElementById("editNome").value = nome;
            document.getElementById("editLogin").value = login;
            document.getElementById("editSenha").value = "";
            document.getElementById("editCargo").value = cargo.toLowerCase().trim();
            document.getElementById("formEdicao").onsubmit = e => salvarEdicao(e, id);
            document.getElementById("btnExcluir").onclick = () => excluirUsuario(id);
        }

        function fecharPopups() {
            popupEdicao.classList.add("hidden");
            popupCriar.classList.add("hidden");
        }

        async function salvarEdicao(e, id) {
            e.preventDefault();
            const nome = document.getElementById("editNome").value;
            const login = document.getElementById("editLogin").value;
            const senha = document.getElementById("editSenha").value;
            const cargo = document.getElementById("editCargo").value;

            const body = { nome, login, cargo };
            if (senha) body.senha = senha;

            const resp = await fetch(`${API_BASE}/user/atualizar/${id}`, {
                method: "PUT",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify(body)
            });

            if (resp.ok) {
                alert("Usuário atualizado com sucesso!");
                fecharPopups();
                carregarUsuarios();
            } else {
                alert("Erro ao atualizar usuário!");
            }
        }

        async function excluirUsuario(id) {
            if (!confirm("Tem certeza que deseja excluir este usuário?")) return;
            const resp = await fetch(`${API_BASE}/user/deletar/${id}`, { method: "DELETE" });
            if (resp.ok) {
                alert("Usuário excluído!");
                fecharPopups();
                carregarUsuarios();
            }
        }

        document.getElementById("btnCriar").addEventListener("click", () => {
            popupCriar.classList.remove("hidden");
        });

        document.getElementById("btnCancelar").addEventListener("click", fecharPopups);
        document.getElementById("btnCancelarCriar").addEventListener("click", fecharPopups);
        document.getElementById("btnVoltar").addEventListener("click", () => window.location.href = "pesquisa.html");

        document.getElementById("formCriar").addEventListener("submit", async e => {
            e.preventDefault();
            const nome = document.getElementById("novoNome").value;
            const login = document.getElementById("novoLogin").value;
            const senha = document.getElementById("novaSenha").value;
            const cargo = document.getElementById("novoCargo").value;

            const resp = await fetch(`${API_BASE}/user/criar`, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ nome, login, senha, cargo })
            });

            if (resp.ok) {
                alert("Usuário criado com sucesso!");
                document.getElementById("formCriar").reset();
                fecharPopups();
                carregarUsuarios();
            } else {
                alert("Erro ao criar usuário!");
            }
        });

        themeToggle.addEventListener("click", () => {
            document.body.classList.toggle("dark-mode");
            const modoEscuroAtivo = document.body.classList.contains("dark-mode");

            themeToggle.textContent = modoEscuroAtivo ? "☀️" : "🌙";
            localStorage.setItem("tema", modoEscuroAtivo ? "dark" : "light");
        });

        carregarUsuarios();
    </script>
</body>

</html>
